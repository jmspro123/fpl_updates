services:
  - type: worker
    name: fpl-score-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python fpl_bot.py
    envVars:
      - key: TG_TOKEN
        sync: false
      - key: FPL_LEAGUE_ID
        sync: false
      - key: TG_CHAT_ID
        sync: false
      - key: FPL_LEAGUE_ID_2
        sync: false
      - key: TG_CHAT_ID_2
        sync: false